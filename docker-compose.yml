services:
  app:
    build: .
    container_name: quiz-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/ss6_project_quiz2
      - REDIS_HOST=redis
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: quiz-mysql
    environment:
      MYSQL_DATABASE: ss6_project_quiz2
      MYSQL_ROOT_PASSWORD: ad1412
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: quiz-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: