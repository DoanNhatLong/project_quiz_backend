spring.application.name=ss6_project_quiz

# Database - ?u tiên l?y t? bi?n môi tr??ng ?? b?o m?t
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ss6_project_quiz2?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:ad1412}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Server & Logging
server.address=0.0.0.0
server.port=${PORT:8080}
logging.level.com.example.ss6_quiz=DEBUG

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.messages.encoding=UTF-8
spring.jackson.mapper.default-view-inclusion=true

# OAuth2 Google (KHÔNG ?? secret tr?c ti?p ? ?ây)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-id-here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-secret-here}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# AI Key (KHÔNG ?? key tr?c ti?p ? ?ây)
groq.api.key=${GROQ_API_KEY:your-groq-key-here}